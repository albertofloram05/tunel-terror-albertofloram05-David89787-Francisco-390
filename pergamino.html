        <h1>Diario del vigilante</h1>

        <p>Día 1. Oí <strong>3</strong> golpes dentro de la caja. Será el frío.</p>
        <p>Día 2. He bajado <em>sin linterna</em>. No había nadie... creo.</p>
        <p>Día 3. Solo hay <strong>1</strong> llave del sótano y la tengo yo.</p>
        <p>Día 4. Conté los escalones al subir: <strong>7</strong>. Al bajar eran 8.</p>
        <p><small>
        Si me pasa algo, la <abbr title="3-1-7">combinación</abbr>  está en este diario.
        </small></p>
